# Builds FaceFit on a GitHub-hosted Mac, so no local Mac is needed.
# Produces an unsigned .ipa you can install from Windows with Sideloadly or AltStore,
# which sign it with your own Apple ID.
name: Build iOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app (unsigned)
        run: |
          echo "::add-matcher::.github/swift-error-matcher.json"
          set -o pipefail
          xcodebuild \
            -project FaceFit.xcodeproj \
            -target FaceFit \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: List compile errors
        if: failure()
        run: |
          {
            echo "## Compile errors"
            echo '```'
            grep -E ":[0-9]+:[0-9]+: error:" build.log | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/FaceFit.app Payload/
          zip -qry FaceFit-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FaceFit-unsigned-ipa
          path: FaceFit-unsigned.ipa
          retention-days: 14

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
